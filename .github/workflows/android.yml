name: Android

on:
  pull_request:
    paths:
      - "plugins/**/android/**"
      - "packages/**/android/**"

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: dart pub global activate melos
      - run: melos bootstrap

      - name: Analyze Android code
        run: melos run analyze_all
