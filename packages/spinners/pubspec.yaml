# packages/sized_spinner/pubspec.yaml
name: spinners
description: "Spinner with adjust size and platform specific"
publish_to: none
resolution: workspace
version: 1.0.9

environment:
  sdk: ^3.13.7

dependencies:
  ext_string: ^1.0.0
  ext_widget: ^1.0.0
  flutter:
    sdk: flutter
  platform_tools: ^1.0.0

dev_dependencies:
  build_runner: 2.15.1
  flutter_gen_runner: ^5.15.0
  flutter_test:
    sdk: flutter
  icodeforyou_lints: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fuchsia.png
    - assets/tux.png
    - assets/web.png

flutter_gen:
  output: lib/gen/
  integrations:
    image: true
    flutter_svg: true
    rive: true
