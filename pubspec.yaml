# pubspec.yaml
name: icodeforyou_flutter
publish_to: none
description: "Collection of flutter packages"
version: 9.7.2

workspace:
  - packages/analog_clock_widget
  - packages/animated_widgets
  - packages/app_navigation
  - packages/app_preferences
  - packages/app_preferences_service
  - packages/archetypes
  - packages/biometric_gate_service
  - packages/border_caption
  - packages/caption_switch
  - packages/color_grid
  - packages/counter_ring
  - packages/custom_widgets
  - packages/data_grid
  - packages/datetime_pickers
  - packages/demo
  - packages/dependency_resolver
  - packages/dual_selection
  - packages/duration_widget
  - packages/ext_buildcontext
  - packages/ext_datetime
  - packages/ext_duration
  - packages/ext_int
  - packages/ext_string
  - packages/ext_widget
  - packages/extensions
  - packages/haptic_intensity
  - packages/icodeforyou_lints
  - packages/infinite_scroll_picking
  - packages/infinite_scroll_picking_settings
  - packages/island_control
  - packages/my_logger
  - packages/neon
  - packages/ping_pong
  - packages/platform_logs
  - packages/platform_tools
  - packages/platform_utils
  - packages/position_popover
  - packages/prism_bubble_widget
  - packages/random_color_generator
  - packages/remind_me
  - packages/service_locator
  - packages/services_provider
  - packages/settings_widget
  - packages/sincewhen_drift_framework
  - packages/sincewhen_models
  - packages/sincewhen_screens
  - packages/sincewhen_widgets
  - packages/sliders
  - packages/spinners
  - packages/splash_framework
  - packages/sqlite_viewer
  - packages/stacking_widgets
  - packages/template_dart
  - packages/theme_framework
  - packages/three_d_sphere
  - packages/time_spans
  - packages/widget_animation_framework
  - plugins/island_control_android
  - plugins/island_control_ios
  - plugins/status_bar_chameleon
  - programs/pookie
  - programs/since_when_dev
  - programs/template_program
  - programs/tyb
  - programs/widgetbook_workspace

environment:
  sdk: ^3.13.7

dev_dependencies:
  mason_cli: ^0.1.4
  melos: ^8.7.0
  very_good_analysis: ^10.3.0

melos:
  scripts:
    analyze:
      run: dart analyze .

    analyze_all:
      description: Analyze all packages
      exec: dart analyze .

    build:
      description: Run build_runner in packages that need it
      exec: dart run build_runner build --delete-conflicting-outputs
      packageFilters:
        dependsOn: "build_runner"

    # ─── TEST (CWD-SAFE) ─────────────────────────────────────────────────────

    test:
      description: |
        Run tests in every workspace member that has a test directory,
        executed from inside each package so the test compiler resolves
        the entrypoint against the correct project. Sequential to avoid
        Flutter tool lock conflicts. Golden (PNG) tests are excluded;
        regenerate those with `melos goldens`.
        Usage: melos test
        Scoped: melos exec --scope=data_grid -- fvm flutter test --exclude-tags golden
      exec:
        command: fvm flutter test --concurrency=1 --exclude-tags golden
        concurrency: 1
        failFast: true
      packageFilters:
        dirExists: test

    # ─── GOLDENS ─────────────────────────────────────────────────────────────

    goldens:
      description: |
        Regenerate PNG goldens in every package that declares the `golden`
        tag. Platform-specific output — run on macOS and commit the PNGs.
        Usage: melos goldens
        Scoped: melos exec --scope=neon -- fvm flutter test --update-goldens --tags golden
      exec:
        command: fvm flutter test --update-goldens --tags golden
        concurrency: 1
      packageFilters:
        fileExists: dart_test.yaml

    # ─── COVERAGE CLEAN ───────────────────────────────────────────────────────

    coverage_clean:
      description: Clean all coverage data from entire workspace
      run: ./melos_tool/melos_test coverage_clean

    # ─── PACKAGES ─────────────────────────────────────────────────────────────

    test_package:
      description: |
        Run tests and coverage for a single package.
        Usage: PKG=package_name melos test_package
        Example: PKG=since_when melos test_package
      run: ./melos_tool/melos_test test_one packages "$PKG"

    test_all:
      description: |
        Run tests in all packages sequentially to avoid Flutter lock conflicts.
        Usage: melos test_all
        Fail-fast: STRICT=true melos test_all
      run: ./melos_tool/melos_test test_all packages

    test_coverage:
      description: Run tests with coverage in all packages (auto-detects Flutter vs Dart)
      run: ./melos_tool/melos_test test_coverage packages

    coverage_merge:
      description: Merge coverage reports from all packages into coverage/html/
      run: ./melos_tool/melos_test coverage_merge packages

    # ─── PLUGINS ─────────────────────────────────────────────────────────────

    test_plugin:
      description: |
        Run tests and coverage for a single plugin.
        Usage: PRG=plugin_name melos test_plugin
        Example: PRG=status_bar_chameleon melos test_plugin
      run: ./melos_tool/melos_test test_one plugins "$PRG"

    test_plugins:
      description: |
        Run tests in all plugins sequentially.
        Usage: melos test_plugins
        Fail-fast: STRICT=true melos test_plugins
      run: ./melos_tool/melos_test test_all plugins

    test_plugin_coverage:
      description: Run tests with coverage in all plugins
      run: ./melos_tool/melos_test test_coverage plugins

    coverage_merge_plugins:
      description: Merge coverage reports from all plugins into coverage/plugins_html/
      run: ./melos_tool/melos_test coverage_merge plugins

    # ─── PROGRAMS ─────────────────────────────────────────────────────────────

    test_program:
      description: |
        Run tests and coverage for a single program.
        Usage: PRG=program_name melos test_program
        Example: PRG=startup_demo melos test_program
      run: ./melos_tool/melos_test test_one programs "$PRG"

    test_programs:
      description: |
        Run tests in all programs sequentially (excludes widgetbook_workspace).
        Usage: melos test_programs
        Fail-fast: STRICT=true melos test_programs
      run: ./melos_tool/melos_test test_all programs

    test_programs_coverage:
      description: Run tests with coverage in all programs (excludes widgetbook_workspace)
      run: ./melos_tool/melos_test test_coverage programs

    coverage_merge_programs:
      description: Merge coverage reports from all programs into coverage/programs_html/
      run: ./melos_tool/melos_test coverage_merge programs

    # ─── COVERAGE ─────────────────────────────────────────────────────────────

    coverage_merge_all:
      description: Merge coverage from all packages + plugins + programs into coverage/all_html/
      run: ./melos_tool/melos_test coverage_merge_all

    # ─── WIDGETBOOK ───────────────────────────────────────────────────────────

    widgetbook:
      description: Run widgetbook for development
      run: |
        cd programs/widgetbook_workspace
        flutter run -d chrome

    widgetbook_build:
      description: Build widgetbook components
      run: |
        cd programs/widgetbook_workspace
        dart run build_runner build --delete-conflicting-outputs
        echo "✅ Widgetbook build completed"

    widgetbook_clean:
      description: Clean widgetbook generated files
      run: |
        cd programs/widgetbook_workspace
        dart run build_runner clean
        echo "🧹 Widgetbook generated files cleaned"

    # ─── UTILITIES ────────────────────────────────────────────────────

    list_packages:
      description: List all packages and programs in workspace
      run: |
        echo "📦 Workspace packages:"
        find . -name "pubspec.yaml" -not -path "./pubspec.yaml" -exec dirname {} \; | sort
