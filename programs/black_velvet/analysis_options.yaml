# programs/black_velvet/analysis_options.yaml
include: package:icodeforyou_lints/analysis_options.yaml

analyzer:
  errors:
    always_use_package_imports: ignore
    unused_element: ignore

  exclude:
    - '/ios/Runner/StatusBarFlutterViewController.swift'
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    flutter_style_todos: true

