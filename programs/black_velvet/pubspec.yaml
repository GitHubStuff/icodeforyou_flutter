name: black_velvet
description: "Black Velvet Launch Screen"
publish_to: none
resolution: workspace
version: 1.0.0

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  analog_clock_widget: ^1.0.0
  custom_widgets: ^1.0.0
  dependency_resolver: ^1.0.0

  flutter:
    sdk: flutter
  rail_navigation: ^1.0.0
  shared_preferences: ^2.5.5
  splash_framework: ^1.0.0
  status_bar_chameleon: ^1.0.1
  theme_framework: ^1.0.0

dev_dependencies:
  build_runner: 2.15.1
  flutter_gen_runner: ^5.15.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  icodeforyou_lints: ^1.0.0
  

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/splash_screen.png

# Flutter Gen to create const assets
# From terminal: % dart run build_runner build
flutter_gen:
  output: lib/gen/

  integrations:
     image: true
     flutter_svg: true
     rive: true           # Interactive vector animations (aka .riv files)


# Launcher Icons
# From terminal: % dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon.png
  remove_alpha_ios: true

  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon_foreground.png
  adaptive_icon_monochrome: assets/icon_monochrome.png
  min_sdk_android: 21

  ios: true

  web:
    generate: true
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"

  macos:
    generate: true
    image_path: assets/icon.png

  windows:
    generate: true
    image_path: assets/icon.png
    icon_size: 256