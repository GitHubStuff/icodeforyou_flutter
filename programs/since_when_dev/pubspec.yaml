name: since_when_dev
description: "Development app"
publish_to: none
resolution: workspace
version: 1.0.1

environment:
  sdk: ^3.13.7

dependencies:
  analog_clock_widget: ^1.0.0
  app_navigation: ^1.0.0
  caption_switch: ^1.0.0
  custom_widgets: ^1.0.0
  demo: ^1.0.0
  dependency_resolver: ^1.0.0
  flutter:
    sdk: flutter
  haptic_intensity: ^1.0.0
  ping_pong: ^1.0.0
  prism_bubble_widget: ^1.0.0
  services_provider: ^1.0.0
  shared_preferences: ^2.5.5
  sincewhen_widgets: ^1.0.0
  sliders: ^1.0.0
  spinners: ^1.0.0
  splash_framework: ^1.0.0
  status_bar_chameleon: ^1.0.1
  theme_framework: ^1.0.0
  

dev_dependencies:
  build_runner: 2.15.1
  flutter_gen_runner: ^5.15.0
  flutter_test:
    sdk: flutter
  icodeforyou_lints: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/iconer.png

flutter_gen:
  output: lib/gen/
  integrations:
    image: true
    flutter_svg: true
    rive: true

flutter_launcher_icons:
  image_path: assets/iconer.png
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/iconer_foreground.png
  adaptive_icon_monochrome: assets/iconer_monochrome.png
  min_sdk_android: 21
  ios: true
  web:
    generate: true
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  macos:
    generate: true
    image_path: assets/iconer.png
  windows:
    generate: true
    image_path: assets/iconer.png
    icon_size: 256