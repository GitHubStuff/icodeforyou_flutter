# plugins/status_bar_ios/pubspec.yaml
name: status_bar_ios
description: "Shows or hides the iOS status bar instantly"
version: 1.0.0
homepage: https://icodeforyou.com
resolution: workspace

environment:
  sdk: ^3.13.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  icodeforyou_lints: ^1.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: StatusBarIosPlugin
