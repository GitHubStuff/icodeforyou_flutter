# plugins/status_bar_android/pubspec.yaml
# Version: 0.0.1-a StatusBarAndroid
name: status_bar_android
description: >-
  Instant show/hide of the Android status bar, with no system animation.
  Standalone, Android-only (API 30+); not a federated implementation.
version: 1.0.0
resolution: workspace

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  icodeforyou_lints: ^1.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.icodeforyou.status_bar_android
        pluginClass: StatusBarAndroidPlugin
