# bricks/template/dart_brick.yaml
#
# Copied by bricks/brick_creator into bricks/<name>/brick.yaml.
# color_grid   -> the brick / source package name (snake_case)
# packages/color_grid -> the source path, e.g. packages/color_grid
name: color_grid
description: >-
  icodeforyou Flutter template generated from packages/color_grid.
version: 1.0.0

environment:
  mason: ">=0.1.0 <0.2.0"

vars:
  name:
    type: string
    description: The name (any case — snake/camel/pascal/title are derived)
    prompt: What is the name?
  description:
    type: string
    description: One-line description for pubspec.yaml
    default: An icodeforyou Flutter package.
    prompt: One-line description?
  is_widget:
    type: boolean
    description: Whether this package is a Flutter widget package (depends on the Flutter SDK)
    default: false
    prompt: Is this a widget package?
  folder_source:
    type: enum
    description: The monorepo folder the package lives in
    default: packages
    values:
      - packages
      - plugins
      - programs
    prompt: Home folder?
