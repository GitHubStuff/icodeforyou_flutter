# bricks/template/brick.yaml
#
# Copied by bricks/brick_creator into bricks/<name>/brick.yaml.
# __name__   -> the brick / source package name (snake_case)
# __source__ -> the source path, e.g. packages/__name__
name: __name__
description: >-
  icodeforyou Flutter template generated from __source__.
version: 1.0.0

environment:
  mason: ">=0.1.0 <0.2.0"

vars:
  name:
    type: string
    description: The name (any case — snake/camel/pascal/title are derived)
    prompt: What is the name?
  description:
    type: string
    description: One-line description for pubspec.yaml
    default: An icodeforyou Flutter package.
    prompt: One-line description?